services:
  riskr:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - riskr-data:/app/instance
    networks:
      - laboratory
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
networks:
  laboratory:
    internal: true
volumes:
  riskr-data:
